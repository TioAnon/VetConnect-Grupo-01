<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <p>Gestión de mensajes y consultas recibidas</p>

    <nav>

        <a href="contacto.html">Contacto</a>

            <div class="tabla-contenedor">

                    </thead>

                </table>

        </section>

    <footer>
        <p>Desarrollo Web y Móvil 2026 - Módulo Admin</p>
