<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetConnect - Práctica Intensiva JS</title>
  <!-- Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">VetConnect</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="mascotas.html">Mascotas</a>
        <a class="nav-link active" href="vetconnect.html">Práctica JS</a>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 fw-bold text-dark mb-0">VetConnect: Mini Aplicación Interactiva</h1>
        <p class="text-muted small">Práctica intensiva de métodos de arrays, eventos y DOM</p>
      </div>
      <!-- Desafío Autónomo 1: Restaurar datos -->
      <button id="btnRestaurar" class="btn btn-outline-danger btn-sm">Restaurar Datos Semilla</button>
    </div>

    <!-- Indicadores / Métricas Dinámicas -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card text-center border-0 shadow-sm rounded-3">
          <div class="card-body">
            <h2 id="totalMascotas" class="display-6 fw-bold text-primary mb-0">0</h2>
            <p class="text-muted small mb-0">Total mascotas</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card text-center border-0 shadow-sm rounded-3">
          <div class="card-body">
            <h2 id="totalPerros" class="display-6 fw-bold text-success mb-0">0</h2>
            <p class="text-muted small mb-0">Perros</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card text-center border-0 shadow-sm rounded-3">
          <div class="card-body">
            <h2 id="totalGatos" class="display-6 fw-bold text-info mb-0">0</h2>
            <p class="text-muted small mb-0">Gatos</p>
          </div>
        </div>
      </div>
      <!-- Desafío Autónomo 2: Promedio de edad -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card text-center border-0 shadow-sm rounded-3">
          <div class="card-body">
            <h2 id="promedioEdad" class="display-6 fw-bold text-warning mb-0">0</h2>
            <p class="text-muted small mb-0">Edad promedio (años)</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario de Registro con Validación -->
    <div class="card border-0 shadow-sm rounded-3 p-4 mb-4">
      <h2 class="h5 fw-bold mb-3">Nueva mascota</h2>
      <form id="formMascota" novalidate>
        <div class="row g-2 mb-2">
          <div class="col-12 col-md-4">
            <input id="nombre" class="form-control" placeholder="Nombre (mín. 2 caracteres)" required>
          </div>
          <div class="col-12 col-md-4">
            <select id="especie" class="form-select" required>
              <option value="">Seleccione especie</option>
              <option value="Perro">Perro</option>
              <option value="Gato">Gato</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <input id="edad" type="number" min="0" max="30" class="form-control" placeholder="Edad (0 a 30)" required>
          </div>
        </div>
        <button class="btn btn-primary px-4 fw-semibold" type="submit">Registrar Mascota</button>
        <div id="mensaje" class="mt-3"></div>
      </form>
    </div>

    <!-- Barra de Búsqueda, Filtros y Ordenamiento -->
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <input id="buscar" class="form-control" placeholder="Buscar por nombre en tiempo real...">
        </div>
        <div class="col-12 col-md-3">
          <select id="filtroEspecie" class="form-select">
            <option value="Todas">Todas las especies</option>
            <option value="Perro">Solo Perros</option>
            <option value="Gato">Solo Gatos</option>
          </select>
        </div>
        <div class="col-12 col-md-3 d-flex gap-2">
          <button id="ordenar" class="btn btn-outline-secondary w-100">Ordenar A-Z</button>
        </div>
      </div>
    </div>

    <!-- Tabla Dinámica -->
    <div class="card border-0 shadow-sm rounded-3 p-3">
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Especie</th>
              <th>Edad</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaMascotas"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/practica-intensiva.js"></script>
</body>
</html>
