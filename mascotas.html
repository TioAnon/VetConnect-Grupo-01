<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - VetConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Mascotas</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="contacto.html">Contacto</a>
    <a href="admin-mensajes.html">Admin</a>
</nav>

<main>

    <h2>Registrar Mascota</h2>

    <form>

        <div class="campo">
            <label>Nombre</label>
            <input type="text" placeholder="Nombre de la mascota">
        </div>

        <div class="campo">
            <label>Especie</label>
            <select>
                <option>Perro</option>
                <option>Gato</option>
                <option>Ave</option>
                <option>Conejo</option>
                <option>Otro</option>
            </select>
        </div>

        <div class="campo">
            <label>Raza</label>
            <input type="text" placeholder="Raza">
        </div>

        <div class="campo">
            <label>Edad</label>
            <input type="number" placeholder="Edad">
        </div>

        <div class="campo campo-completo">
            <label>Nombre del propietario</label>
            <input type="text" placeholder="Nombre del dueño">
        </div>

        <div class="campo campo-completo">
            <button type="submit">Registrar</button>
        </div>

    </form>

    <h2>Mascotas Registradas</h2>

    <table>

        <thead>
            <tr>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Edad</th>
                <th>Propietario</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Firulais</td>
                <td>Perro</td>
                <td>Labrador</td>
                <td>5</td>
                <td>Juan Pérez</td>
            </tr>

            <tr>
                <td>Misu</td>
                <td>Gato</td>
                <td>Persa</td>
                <td>2</td>
                <td>Ana Soto</td>
            </tr>
        </tbody>

    </table>

</main>

</body>
</html>
