<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetConnect - Iniciar Sesión</title>
  <!-- Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navbar Superior Estandarizado -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">VetConnect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenedor Principal Centrado (Card de Login) -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        
        <div class="card shadow-sm border-0 rounded-4 p-3 p-md-4 bg-white">
          <div class="card-body">
            
            <div class="text-center mb-4">
              <h1 class="h3 fw-bold text-dark mb-1">Iniciar Sesión</h1>
              <p class="text-muted small">Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <div id="loginFeedback"></div>

            <form id="formLogin" novalidate>
              <!-- Campo Correo Electrónico -->
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small">Correo electrónico</label>
                <input 
                  type="email" 
                  class="form-control" 
                  id="email" 
                  placeholder="usuario@vetconnect.cl" 
                  required
                >
              </div>

              <!-- Campo Contraseña -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="password" class="form-label fw-semibold small mb-0">Contraseña</label>
                  <a href="#" class="small text-decoration-none text-muted">¿Olvidaste tu clave?</a>
                </div>
                <input 
                  type="password" 
                  class="form-control mt-1" 
                  id="password" 
                  placeholder="••••••••" 
                  required
                >
              </div>

              <!-- Checkbox Recordar Sesión -->
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">Recordar mi sesión</label>
              </div>

              <!-- Botón Ingresar -->
              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                Ingresar al sistema
              </button>

              <div class="text-center">
                <small class="text-muted">¿No tienes cuenta? <a href="contacto.html" class="text-decoration-none">Contactar a soporte</a></small>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-white border-top text-center text-muted small mt-auto">
    <div class="container">
      <span>&copy; 2026 VetConnect - Todos los derechos reservados</span>
    </div>
  </footer>

  <!-- Bootstrap JS y Lógica Básica -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const feedback = document.getElementById('loginFeedback');

      if (email === '' || password === '') {
        feedback.innerHTML = '<div class="alert alert-danger py-2 small mb-3">Completa todos los campos para ingresar.</div>';
        return;
      }

      // Simulación de autenticación exitosa hacia el Dashboard
      feedback.innerHTML = '<div class="alert alert-success py-2 small mb-3">Acceso concedido. Redirigiendo...</div>';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    });
  </script>
</body>
</html>
