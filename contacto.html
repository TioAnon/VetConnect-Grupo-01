<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - VetConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
    </header>
 <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">VetConnect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>
    <main class="pagina-contacto">
        <div class="contacto-wrapper">
            <section class="contacto-card">
                <div class="contacto-header">
                    <p class="eyebrow">Atención personalizada</p>
                    <h2>Contáctanos</h2>
                    <p>Queremos ayudarte a cuidar a tu mascota. Envíanos tu consulta y te responderemos a la brevedad.</p>
                </div>

                <form class="form-contacto">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="tuemail@ejemplo.com">

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..."></textarea>

                    <button type="submit">Enviar mensaje</button>
                </form>
            </section>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
