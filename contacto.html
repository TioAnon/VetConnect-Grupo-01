<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - VetConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
    </header>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="contacto.html">Contacto</a>
        <a href="admin-mensajes.html">Admin</a>
    </nav>
    <main class="pagina-contacto">
        <div class="contacto-wrapper">
            <section class="contacto-card">
                <div class="contacto-header">
                    <p class="eyebrow">Atención personalizada</p>
                    <h2>Contáctanos</h2>
                    <p>Queremos ayudarte a cuidar a tu mascota. Envíanos tu consulta y te responderemos a la brevedad.</p>
                </div>

                <form class="form-contacto">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="tuemail@ejemplo.com">

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje..."></textarea>

                    <button type="submit">Enviar mensaje</button>
                </form>
            </section>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
