<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - VetConnect</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        main{
            width: 80%;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        h2{
            color:#1f3b5b;
            border-bottom:2px solid #1abc9c;
            padding-bottom:10px;
            margin-bottom:20px;
        }

        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
            margin-bottom:40px;
        }

        .campo{
            display:flex;
            flex-direction:column;
        }

        .campo-completo{
            grid-column:1/3;
        }

        input, select{
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:180px;
            padding:12px;
            background:#1abc9c;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#169b82;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        th{
            background:#1abc9c;
            color:white;
        }

        tr:nth-child(even){
            background:#f5f5f5;
        }
    </style>

</head>
<body>

<header>
    <h1>Mascotas</h1>
</header>

<nav>
    <a href="index.html">Inicio</a>
    <a href="contacto.html">Contacto</a>
    <a href="admin-mensajes.html">Admin</a>
</nav>

<main>

    <h2>Registrar Mascota</h2>

    <form>

        <div class="campo">
            <label>Nombre</label>
            <input type="text" placeholder="Nombre de la mascota">
        </div>

        <div class="campo">
            <label>Especie</label>
            <select>
                <option>Perro</option>
                <option>Gato</option>
                <option>Ave</option>
                <option>Conejo</option>
                <option>Otro</option>
            </select>
        </div>

        <div class="campo">
            <label>Raza</label>
            <input type="text" placeholder="Raza">
        </div>

        <div class="campo">
            <label>Edad</label>
            <input type="number" placeholder="Edad">
        </div>

        <div class="campo campo-completo">
            <label>Nombre del propietario</label>
            <input type="text" placeholder="Nombre del dueño">
        </div>

        <div class="campo campo-completo">
            <button type="submit">Registrar</button>
        </div>

    </form>

    <h2>Mascotas Registradas</h2>

    <table>

        <thead>
            <tr>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Edad</th>
                <th>Propietario</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Firulais</td>
                <td>Perro</td>
                <td>Labrador</td>
                <td>5</td>
                <td>Juan Pérez</td>
            </tr>

            <tr>
                <td>Misu</td>
                <td>Gato</td>
                <td>Persa</td>
                <td>2</td>
                <td>Ana Soto</td>
            </tr>
        </tbody>

    </table>

</main>

</body>
</html>
